# HTTPS front door for the label service, for a Docker Swarm that runs Traefik:
# Traefik only routes to Swarm services, so this tiny nginx service forwards
# LABEL_HOST to the Compose container (compose.yml) over the shared
# traefik-public network. deploy.sh fills in the variables from deploy/.env.
#
# The Traefik labels (entrypoint, cert resolver, network name) match one
# particular setup; change them to match yours.
version: "3.8"

networks:
  traefik-public:
    external: true

configs:
  labels_nginx:
    # Swarm configs can't be changed in place, so the name carries a hash.
    name: labels_nginx_${NGINX_CONF_HASH}
    file: ./nginx.conf

services:
  proxy:
    image: nginx:1.29-alpine
    networks:
      - traefik-public
    configs:
      - source: labels_nginx
        target: /etc/nginx/conf.d/default.conf
    deploy:
      replicas: 1
      placement:
        constraints:
          # The node that runs the Compose container.
          - node.hostname == ${LABEL_NODE}
      labels:
        - traefik.enable=true
        - traefik.docker.network=traefik-public
        - traefik.http.routers.labels.rule=Host(`${LABEL_HOST}`)
        - traefik.http.routers.labels.entrypoints=websecure
        - traefik.http.routers.labels.tls.certresolver=letsencrypt
        - traefik.http.services.labels.loadbalancer.server.port=80
