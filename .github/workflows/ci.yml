name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly, to catch newly published advisories

permissions:
  contents: read

# Jobs run on GitHub-hosted runners only. This repo is public, so a pull
# request from a fork must never reach a self-hosted machine.
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Codecov upload authenticates with OIDC, so no token secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --extra homelab
      - name: Tests with coverage
        run: uv run pytest -q --cov --cov-report=term --cov-report=xml --junitxml=junit.xml -o junit_family=legacy
      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Test coverage"
            uv run coverage report --format=markdown --fail-under=0
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          disable_search: true
          # A fork's pull request gets no OIDC token; Codecov accepts those
          # uploads without one.
          use_oidc: ${{ github.event.pull_request.head.repo.fork != true }}
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results
          files: junit.xml
          disable_search: true
          use_oidc: ${{ github.event.pull_request.head.repo.fork != true }}
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Lint and security rules (ruff)
        run: uv run --locked --only-dev ruff check --output-format=github .

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Dependency vulnerabilities (pip-audit)
        run: |
          uv export --locked --all-extras --no-hashes --no-emit-project > requirements.txt
          uvx pip-audit --strict -r requirements.txt
      - name: Secrets in history (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact -v

  image-scan:
    # Scan the built image (OS packages and Python deps) for known, fixable
    # vulnerabilities. Findings land in Security -> Code scanning; they do not
    # fail the build. Skipped on pull requests, where a fork's token cannot
    # upload results.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: docker build --pull -t label-service:scan .
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: scan
        with:
          image: label-service:scan
          fail-build: false
          only-fixed: true
          severity-cutoff: high
          output-format: sarif
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: image

  image:
    # Publish the label service image on main; deploy/deploy.sh pins the SHA.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, lint, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          pull: true
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
